name: my_LM

services:
  # PostgreSQL Database
  ml-postgres:
    container_name: ml-postgres
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "${POSTGRES_PORT_OUTSIDE_ENV}:${POSTGRES_PORT_INSIDE_ENV}"
    command: >
      postgres -c shared_buffers=256MB -c max_connections=200 -c effective_cache_size=512MB -c maintenance_work_mem=64MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=4MB -c min_wal_size=1GB -c max_wal_size=4GB -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache
  ml-redis:
    container_name: ml-redis
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT_OUTSIDE_ENV}:${REDIS_PORT_INSIDE_ENV}"
    # Exec form so the image entrypoint drops to the redis user (a `sh -c` command ran as root)
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # PHP-FPM for Laravel
  ml-php:
    container_name: ml-php
    build:
      context: ../laravel-api
      dockerfile: ../docker/laravel/Dockerfile
      target: development
    restart: unless-stopped
    working_dir: /var/www/laravel-api
    volumes:
      - ../laravel-api:/var/www/laravel-api
      - ./laravel/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./laravel/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: ${POSTGRES_HOST_INSIDE_ENV}
      DB_PORT: ${POSTGRES_PORT_INSIDE_ENV}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST_INSIDE_ENV}
      REDIS_PORT: ${REDIS_PORT_INSIDE_ENV}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_ENV: local
      APP_DEBUG: "true"
      SEED_DB: ${SEED_DB:-false}
    depends_on:
      ml-postgres:
        condition: service_healthy
      ml-redis:
        condition: service_healthy
      ml-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "6"
        reservations:
          memory: 512M
          cpus: "2"

  # Next.js Frontend
  ml-nextjs:
    container_name: ml-nextjs
    build:
      # Repo root context: installs from the workspace root pnpm-lock.yaml
      context: ..
      dockerfile: docker/nextjs/Dockerfile
      target: development
      args:
        APP: nextjs-fe
    restart: unless-stopped
    volumes:
      - ../nextjs-fe:/repo/nextjs-fe
      - /repo/nextjs-fe/.next
      - /repo/nextjs-fe/node_modules
    environment:
      NODE_ENV: development
      PORT: ${NEXTJS_PORT_INSIDE_ENV}
      HOSTNAME: 0.0.0.0
      # Memory optimization for dev mode
      NODE_OPTIONS: "--max-old-space-size=1536"
    ports:
      - "${NEXTJS_PORT_OUTSIDE_ENV}:${NEXTJS_PORT_INSIDE_ENV}"
    expose:
      - "${NEXTJS_PORT_INSIDE_ENV}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider --timeout=15 http://localhost:${NEXTJS_PORT_INSIDE_ENV}/ || exit 1",
        ]
      interval: 45s
      timeout: 20s
      retries: 5
      start_period: 90s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4"
        reservations:
          memory: 512M
          cpus: "1"

  # Next.js Documentation Frontend
  ml-nextjs-docs:
    container_name: ml-nextjs-docs
    build:
      # Repo root context: installs from the workspace root pnpm-lock.yaml
      context: ..
      dockerfile: docker/nextjs/Dockerfile
      target: development
      args:
        APP: nextjs-docs
    restart: unless-stopped
    volumes:
      - ../nextjs-docs:/repo/nextjs-docs
      - /repo/nextjs-docs/.next
      - /repo/nextjs-docs/node_modules
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:81/api
    ports:
      # 3457 is fixed by nextjs-docs/package.json (`next dev -p 3457`) and the nginx upstream
      - "${NEXTJS_DOCS_PORT_OUTSIDE_ENV}:3457"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider --timeout=15 http://localhost:3457/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Nginx Reverse Proxy
  ml-nginx:
    container_name: ml-nginx
    image: nginxinc/nginx-unprivileged:1.25.5-alpine3.19
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../laravel-api/public:/var/www/laravel-api/public:ro
    ports:
      # Unprivileged nginx listens on 8080 (no TLS in dev; local TLS comes with P4-08)
      - "${NGINX_PORT_OUTSIDE_ENV}:8080"
    depends_on:
      ml-php:
        condition: service_healthy
      ml-nextjs:
        condition: service_healthy
      ml-nextjs-docs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # MinIO Object Storage (S3-compatible)
  ml-minio:
    container_name: ml-minio
    build:
      context: ./minio
      args:
        MINIO_IMAGE: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    ports:
      - "${MINIO_PORT_OUTSIDE_ENV}:${MINIO_PORT_INSIDE_ENV}"
      - "${MINIO_CONSOLE_PORT_OUTSIDE_ENV}:${MINIO_CONSOLE_PORT_INSIDE_ENV}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT_OUTSIDE_ENV}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT_INSIDE_ENV}"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${MINIO_PORT_INSIDE_ENV}/minio/health/live",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "4"
        reservations:
          memory: 256M
          cpus: "2"

  # MinIO client - auto init buckets
  ml-minio-init:
    container_name: ml-minio-init
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    user: "1000:1000"
    depends_on:
      ml-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_OFFICIAL: ${MINIO_BUCKET_OFFICIAL}
      MINIO_BUCKET_TEMP: ${MINIO_BUCKET_TEMP}
      MINIO_IAM_USER: ${MINIO_IAM_USER}
      MINIO_IAM_PASSWORD: ${MINIO_IAM_PASSWORD}
      # mc keeps its config under $HOME/.mc; the unprivileged user has no home
      HOME: /tmp
    volumes:
      - ./minio:/minio:ro
    entrypoint: ["/bin/sh", "/minio/create-buckets.sh"]
    networks:
      - app-network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
    name: ml_postgres_data
  redis_data:
    driver: local
    name: ml_redis_data
  minio_data:
    driver: local
    name: ml_minio_data

# Network configuration
networks:
  app-network:
    driver: bridge
    name: ml_network

name: my_LM

services:
  # PostgreSQL Database
  ml-postgres:
    container_name: ml-postgres
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Folders, never single files: on Docker Desktop + WSL a single-file bind mount goes stale
      # when WSL restarts and the container fails with exit 127 (incident 2026-10-20). Long syntax
      # next to a named volume: the short `-v` form makes Docker Desktop stage the folder the same way.
      - type: bind
        source: ./postgres
        target: /etc/postgresql/custom
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${POSTGRES_PORT_OUTSIDE_ENV}:${POSTGRES_PORT_INSIDE_ENV}"
    command: >
      postgres -c shared_buffers=256MB -c max_connections=200 -c effective_cache_size=512MB -c maintenance_work_mem=64MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=4MB -c min_wal_size=1GB -c max_wal_size=4GB -c hba_file=/etc/postgresql/custom/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache
  ml-redis:
    container_name: ml-redis
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      # Folder, long syntax (see ml-postgres)
      - type: bind
        source: ./redis
        target: /usr/local/etc/redis
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${REDIS_PORT_OUTSIDE_ENV}:${REDIS_PORT_INSIDE_ENV}"
    # The password goes into a config file written at start instead of the command line (seen by
    # `ps` and `docker inspect`); calling the image entrypoint again drops Redis to the redis user.
    # rm first: on a restart the file from the last run is still there, owned by redis, and the
    # kernel (fs.protected_regular) stops even root from rewriting it in the sticky /tmp
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        rm -f /tmp/redis-auth.conf &&
        printf 'include /usr/local/etc/redis/redis.conf\nrequirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf &&
        chown redis:redis /tmp/redis-auth.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # PHP-FPM for Laravel
  ml-php:
    container_name: ml-php
    build:
      context: ../laravel-api
      dockerfile: ../docker/laravel/Dockerfile
      target: development
    restart: unless-stopped
    working_dir: /var/www/laravel-api
    volumes:
      - ../laravel-api:/var/www/laravel-api
      # Folder mount (see ml-postgres): the entrypoint and php.ini (Dockerfile: PHP_INI_SCAN_DIR)
      - ./laravel:/opt/ml-docker:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: ${POSTGRES_HOST_INSIDE_ENV}
      DB_PORT: ${POSTGRES_PORT_INSIDE_ENV}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST_INSIDE_ENV}
      REDIS_PORT: ${REDIS_PORT_INSIDE_ENV}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_ENV: local
      APP_DEBUG: "true"
      SEED_DB: ${SEED_DB:-false}
    depends_on:
      ml-postgres:
        condition: service_healthy
      ml-redis:
        condition: service_healthy
      ml-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "6"
        reservations:
          memory: 512M
          cpus: "2"

  # Background jobs (ADR-0014): same image and code mount as ml-php, started after it so its
  # entrypoint (composer install, migrations) has finished; they run artisan directly.
  ml-queue:
    &laravel-worker
    container_name: ml-queue
    build:
      context: ../laravel-api
      dockerfile: ../docker/laravel/Dockerfile
      target: development
    restart: unless-stopped
    working_dir: /var/www/laravel-api
    entrypoint: ["php", "artisan"]
    # --timeout below the queue's retry_after (config/queue.php); a code change needs `make workers-restart`
    command: ["queue:work", "redis", "--sleep=1", "--timeout=900", "--max-time=3600"]
    volumes:
      - ../laravel-api:/var/www/laravel-api
      - ./laravel:/opt/ml-docker:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: ${POSTGRES_HOST_INSIDE_ENV}
      DB_PORT: ${POSTGRES_PORT_INSIDE_ENV}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST_INSIDE_ENV}
      REDIS_PORT: ${REDIS_PORT_INSIDE_ENV}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      ml-php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q artisan /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

  # Runs the Laravel schedule (routes/console.php), e.g. the clean-up of stuck uploads
  ml-scheduler:
    <<: *laravel-worker
    container_name: ml-scheduler
    command: ["schedule:work"]

  # WebSocket server for live notifications; browsers reach it through nginx (/app/...)
  ml-reverb:
    <<: *laravel-worker
    container_name: ml-reverb
    command: ["reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Next.js Frontend
  ml-nextjs:
    container_name: ml-nextjs
    build:
      # Repo root context: installs from the workspace root pnpm-lock.yaml
      context: ..
      dockerfile: docker/nextjs/Dockerfile
      target: development
      args:
        APP: nextjs-fe
    restart: unless-stopped
    volumes:
      - ../nextjs-fe:/repo/nextjs-fe
      - /repo/nextjs-fe/.next
      - /repo/nextjs-fe/node_modules
    environment:
      NODE_ENV: development
      PORT: ${NEXTJS_PORT_INSIDE_ENV}
      HOSTNAME: 0.0.0.0
      # Memory optimization for dev mode
      NODE_OPTIONS: "--max-old-space-size=1536"
    ports:
      - "${NEXTJS_PORT_OUTSIDE_ENV}:${NEXTJS_PORT_INSIDE_ENV}"
    expose:
      - "${NEXTJS_PORT_INSIDE_ENV}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider --timeout=15 http://localhost:${NEXTJS_PORT_INSIDE_ENV}/admin/login || exit 1",
        ]
      interval: 45s
      timeout: 20s
      retries: 5
      start_period: 90s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4"
        reservations:
          memory: 512M
          cpus: "1"

  # Public site (public-site/, Astro, ADR-0019, ADR-0021): every path but /admin, no login needed
  ml-public-site:
    container_name: ml-public-site
    build:
      # Repo root context: installs from the workspace root pnpm-lock.yaml
      context: ..
      dockerfile: docker/public-site/Dockerfile
      target: development
    restart: unless-stopped
    volumes:
      - ../public-site:/repo/public-site
      - /repo/public-site/.astro
      - /repo/public-site/node_modules
    environment:
      NODE_ENV: development
    ports:
      # 4321 is fixed by public-site/astro.config.mjs and the nginx upstream
      - "${PUBLIC_SITE_PORT_OUTSIDE_ENV:-3002}:4321"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider --timeout=15 http://localhost:4321/healthz || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          # The dev server needs ~150 MB; `astro check` (type check) up to ~700 MB
          memory: 1G
        reservations:
          memory: 128M

  # Nginx Reverse Proxy
  ml-nginx:
    container_name: ml-nginx
    image: nginxinc/nginx-unprivileged:1.25.5-alpine3.19
    restart: unless-stopped
    volumes:
      # Folder mount (see ml-postgres): edits show up at once, `nginx -s reload` is enough
      - ./nginx:/etc/nginx/custom:ro
      - ../laravel-api/public:/var/www/laravel-api/public:ro
    command: ["nginx", "-c", "/etc/nginx/custom/nginx.conf", "-g", "daemon off;"]
    ports:
      # Unprivileged nginx listens on 8080 (no TLS in dev; local TLS comes with P4-08)
      - "${NGINX_PORT_OUTSIDE_ENV}:8080"
    depends_on:
      ml-php:
        condition: service_healthy
      ml-nextjs:
        condition: service_healthy
      ml-public-site:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # MinIO Object Storage (S3-compatible)
  ml-minio:
    container_name: ml-minio
    build:
      context: ./minio
      args:
        MINIO_IMAGE: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    ports:
      - "${MINIO_PORT_OUTSIDE_ENV}:${MINIO_PORT_INSIDE_ENV}"
      - "${MINIO_CONSOLE_PORT_OUTSIDE_ENV}:${MINIO_CONSOLE_PORT_INSIDE_ENV}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT_OUTSIDE_ENV}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT_INSIDE_ENV}"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${MINIO_PORT_INSIDE_ENV}/minio/health/live",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "4"
        reservations:
          memory: 256M
          cpus: "2"

  # MinIO client - auto init buckets
  ml-minio-init:
    container_name: ml-minio-init
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    user: "1000:1000"
    depends_on:
      ml-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_OFFICIAL: ${MINIO_BUCKET_OFFICIAL}
      MINIO_BUCKET_TEMP: ${MINIO_BUCKET_TEMP}
      MINIO_IAM_USER: ${MINIO_IAM_USER}
      MINIO_IAM_PASSWORD: ${MINIO_IAM_PASSWORD}
      # mc keeps its config under $HOME/.mc; the unprivileged user has no home
      HOME: /tmp
    volumes:
      - ./minio:/minio:ro
    entrypoint: ["/bin/sh", "/minio/create-buckets.sh"]
    networks:
      - app-network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
    name: ml_postgres_data
  redis_data:
    driver: local
    name: ml_redis_data
  minio_data:
    driver: local
    name: ml_minio_data

# Network configuration
networks:
  app-network:
    driver: bridge
    name: ml_network

# Note: Upstream blocks with static IPs have been removed.
# We explicitly use variables with the Docker DNS resolver (127.0.0.11) 
# to ensure IP addresses are resolved dynamically on-the-fly.
# This eliminates 502 Bad Gateway errors when containers are recreated (e.g. during build or restore).

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
# Over the limit is "Too Many Requests", not the default 503 (BUG-02)
limit_req_status 429;

# HTTP Server
server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    # Client settings
    client_max_body_size 50M;
    client_body_timeout 60s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health check endpoint
    # Exact match: a prefix would also catch /healthz and any public page starting with /health
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Laravel API routes - Use ^~ to give this location priority
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        # Pass all API requests to Laravel's index.php via FastCGI
        resolver 127.0.0.11 valid=15s;
        set $upstream_php ml-php:9000;
        
        fastcgi_pass $upstream_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/laravel-api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include /etc/nginx/fastcgi_params;
        
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # Reverb WebSocket for live notifications (ADR-0014): ws://<host>/app/<app key>.
    # Private channels are authorized by POST /api/broadcasting/auth (Laravel, session cookie).
    location ^~ /app/ {
        resolver 127.0.0.11 valid=15s;
        set $upstream_reverb ml-reverb:8080;

        proxy_pass http://$upstream_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A connection stays open for the whole session; the client pings every ~30s
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # MinIO media bucket (ADR-0014): the browser uploads and downloads through presigned URLs that
    # Laravel signs for this host, so Host must reach MinIO unchanged or the signature fails.
    # The bucket name matches MINIO_BUCKET_OFFICIAL; MinIO checks every request's signature.
    location ^~ /media-official/ {
        resolver 127.0.0.11 valid=15s;
        set $upstream_minio ml-minio:9000;

        proxy_pass http://$upstream_minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Stream bodies both ways: no size cap here (the API limits sizes), no buffering to disk
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Laravel static assets
    location ~ ^/(css|js|images|fonts|storage)/ {
        root /var/www/laravel-api/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The old CMS documentation is gone; its links land on the public home page (ADR-0019, ADR-0021)
    location ~ ^/docs(/|$) {
        # Relative Location: the browser keeps its own host and port (nginx listens on 8080 inside)
        absolute_redirect off;
        return 301 /;
    }

    # The admin sign-in page moved under /admin (ADR-0021)
    location = /login {
        absolute_redirect off;
        return 301 /admin/login$is_args$args;
    }

    # Next.js static assets (_next/static) - for main frontend
    location /_next/static/ {
        resolver 127.0.0.11 valid=15s;
        set $upstream_nextjs ml-nextjs:6543;
        proxy_pass http://$upstream_nextjs;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache for 1 year (Next.js uses content hashing)
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Next.js dynamic chunks - for main frontend
    location /_next/ {
        resolver 127.0.0.11 valid=15s;
        set $upstream_nextjs ml-nextjs:6543;
        proxy_pass http://$upstream_nextjs;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js public folder (favicon of the admin app)
    location = /favicon.ico {
        resolver 127.0.0.11 valid=15s;
        set $upstream_nextjs ml-nextjs:6543;
        proxy_pass http://$upstream_nextjs;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Admin app (Next.js): its pages live under /admin; /__nextjs… is its dev error overlay
    location ~ ^/(admin(/|$)|__nextjs) {
        limit_req zone=general_limit burst=50 nodelay;
        
        resolver 127.0.0.11 valid=15s;
        set $upstream_nextjs ml-nextjs:6543;
        proxy_pass http://$upstream_nextjs;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Increased timeouts for SSR and container restart tolerance
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        
        # Disable buffering for better streaming
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Cache settings
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_pragma $http_authorization;
    }

    # Public site (public-site/, Astro): every path the admin app does not own, so the site lives at
    # the root (ADR-0021). In dev that includes Vite's own files (/@vite/client, /src/…).
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        resolver 127.0.0.11 valid=15s;
        set $upstream_site ml-public-site:4321;
        proxy_pass http://$upstream_site;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Increased timeouts for SSR and container restart tolerance
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        
        # Disable buffering for better streaming
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Cache settings
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_pragma $http_authorization;
    }

    # Deny access to sensitive files (but not the public site's dev files: Vite's cache
    # /node_modules/.vite/, and Astro's own browser scripts under /@fs/…/node_modules/.pnpm/)
    location ~ /\.(?!vite/|pnpm/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.ht {
        deny all;
    }
}


name: CI

# Thin wrapper (ADR-0016): every check lives in ci/, the same scripts `make ci` runs locally.
# Paused (ADR-0012): manual runs only (Actions → CI → Run workflow). Re-enabling: ci/README.md.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Checks (ci/check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Composer and pnpm downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/second-memory-ci
          key: ci-${{ hashFiles('laravel-api/composer.lock', 'pnpm-lock.yaml') }}
          restore-keys: ci-

      - name: Run every check
        run: ci/check.sh

  build:
    name: Production images (ci/build.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the api, nextjs-fe and nextjs-docs images (no push)
        run: ci/build.sh

name: CI

on:
  pull_request:
    branches:
      - developer
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # Frontend: nextjs-fe + nextjs-docs (pnpm workspace root)
  # ============================================================
  frontend:
    name: Frontend (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version comes from the root package.json "packageManager"
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Matches the Docker images; moves to 24 with U2
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: API types are up to date
        run: |
          pnpm --filter nextjs-fe gen:api
          git diff --exit-code nextjs-fe/src/shared/types/openapi.d.ts || { echo "::error::openapi.d.ts is stale, run 'make openapi' and commit it"; exit 1; }

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # nextjs-fe enforces coverage thresholds on src/shared (vitest.config.ts)
        run: pnpm test --coverage

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Audit all dependencies (informational)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # ============================================================
  # Backend: laravel-api against real Postgres + Redis
  # ============================================================
  backend:
    name: Backend (pint, larastan, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./laravel-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # phpunit.xml forces DB_DATABASE=testing
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Real env vars win over laravel-api/.env.testing
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # Laravel's env() turns the string "null" into null (no AUTH)
      REDIS_PASSWORD: "null"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches docker/laravel/Dockerfile
          php-version: "8.5"
          extensions: pdo_pgsql, pgsql, redis, zip, exif, pcntl, bcmath, gd
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('laravel-api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: composer lint

      - name: Larastan
        run: composer analyse -- --no-progress --error-format=github

      - name: Tests
        # The 4 RefreshTokenApiTest cases fail until Sanctum replaces the custom
        # JWT (PRB-001, backlog P2-11). Remove the exclusion then.
        run: php artisan test --exclude-filter 'RefreshTokenApiTest::test_t0(04|05|06|19)_'

      - name: OpenAPI spec is up to date
        # Runs after the tests so the testing DB has the schema Scramble inspects
        run: |
          php artisan scramble:export
          git diff --exit-code openapi.json || { echo "::error::openapi.json is stale, run 'make openapi' and commit it"; exit 1; }

      - name: Audit dependencies
        run: composer audit
        continue-on-error: true

  # ============================================================
  # Docker: production images still build (no push)
  # ============================================================
  docker:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./laravel-api
            file: ./docker/laravel/Dockerfile
            build-args: ""
          - name: fe
            context: .
            file: ./docker/nextjs/Dockerfile
            build-args: APP=nextjs-fe

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: production
          build-args: ${{ matrix.build-args }}
          push: false
          # Read-only use of the CD cache scopes
          cache-from: type=gha,scope=${{ matrix.name }}

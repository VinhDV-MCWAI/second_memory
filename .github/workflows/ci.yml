name: CI Pipeline

on:
  pull_request:
    branches:
      - developer

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # Job 1: Lint, Type-check, Format (Frontend)
  # ============================================================
  frontend-quality:
    name: "Frontend Quality Checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nextjs-fe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the root package.json "packageManager"
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test --run

  # ============================================================
  # Job 2: Security Audit
  # ============================================================
  security-audit:
    name: "Security Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the root package.json "packageManager"
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run security audit (frontend)
        run: pnpm audit --audit-level=high
        working-directory: ./nextjs-fe
        continue-on-error: true

      - name: Run security audit (Laravel - composer)
        uses: symfonycorp/security-checker-action@v5
        with:
          lock: laravel-api/composer.lock
        continue-on-error: true

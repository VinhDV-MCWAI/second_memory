packages:
  - "nextjs-fe"
  - "nextjs-docs"

# Dependencies allowed to run install (build) scripts.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# One exact Tiptap 3 version across both apps (editor and docs renderer); extension
# types break when two @tiptap/core copies are installed.
overrides:
  "@tiptap/core": 3.20.4
  "@tiptap/pm": 3.20.4
  "@tiptap/react": 3.20.4
